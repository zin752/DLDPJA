<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#081326">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جدولي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>جدولي الأسبوعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#081326;--bg2:#10294a;--orb1:rgba(93,225,255,.22);--orb2:rgba(155,140,255,.22);
  --glass:rgba(255,255,255,.07);--glass2:rgba(255,255,255,.12);--line:rgba(255,255,255,.15);
  --text:#eaf2ff;--muted:#9db2d3;--cyan:#5de1ff;--violet:#9b8cff;--ok:#5af0b0;--danger:#ff7a93;
  --font:'Readex Pro','Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:light){:root{
  --bg1:#e9f0fb;--bg2:#cfdcf3;--orb1:rgba(60,160,220,.28);--orb2:rgba(140,120,240,.25);
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.8);--line:rgba(20,40,80,.14);
  --text:#14213a;--muted:#51648a;--cyan:#0a8bb8;--violet:#6a55e0;--ok:#0f9d68;--danger:#d63a5c;color-scheme:light}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--text);
  background:radial-gradient(60% 50% at 15% 10%,var(--orb1),transparent 70%),radial-gradient(55% 45% at 90% 85%,var(--orb2),transparent 70%),linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1280px;margin:0 auto;padding:22px 16px 90px}
header{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px}
h1{margin:0;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:700;letter-spacing:-.01em}
.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:14px;font-weight:600;transition:transform .15s,box-shadow .2s,background .2s}
.btn.primary{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06122a;box-shadow:0 0 22px rgba(93,225,255,.35)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 0 30px rgba(93,225,255,.55)}
.btn.ghost{background:var(--glass2);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--glass)}
.btn[disabled]{opacity:.4;pointer-events:none}
.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-size:.88rem;color:var(--muted)}
.chip b{color:var(--text);margin-inline-start:4px}
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.day{padding:16px;display:flex;flex-direction:column;gap:10px;min-height:190px}
.day.today{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 0 28px rgba(93,225,255,.25)}
.day h2{margin:0;font-size:1.1rem;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.day h2 small{color:var(--muted);font-weight:400;font-size:.8rem}
.day .badge{font-size:.72rem;padding:2px 9px;border-radius:99px;background:var(--cyan);color:#06122a;font-weight:600}
.bar{height:4px;border-radius:9px;background:var(--glass2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--ok));width:0;transition:width .4s}
.tasks{display:flex;flex-direction:column;gap:8px;flex:1}
.empty{color:var(--muted);font-size:.9rem;margin:auto;text-align:center;padding:14px 0}
.task{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--glass2);border:1px solid var(--line);animation:pop .3s ease both}
.task .ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;color:transparent;transition:.2s}
.task.done .ck{background:var(--ok);border-color:var(--ok);color:#06122a}
.task .info{flex:1;min-width:0}
.task .t{font-weight:500;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .m{font-size:.78rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.task .m span{display:inline-flex;align-items:center;gap:4px}
.acts{display:flex;gap:2px}
.ib{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted);transition:.15s}
.ib:hover{background:var(--glass);color:var(--text)}
.ib.del:hover{color:var(--danger)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
.views{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.dtabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px}
.dtabs .pill{white-space:nowrap}
.tl{padding:6px 0 10px;max-width:880px}
.hr{padding:8px 18px 2px;font-weight:600;color:var(--cyan);font-size:.92rem;border-top:1px solid var(--line);margin-top:6px}
.hr:first-child{border-top:0;margin-top:0}
.slot{display:flex;gap:10px;padding:2px 12px;min-height:42px}
.slot .tm{width:72px;flex:none;color:var(--muted);font-size:.8rem;padding-top:11px;font-variant-numeric:tabular-nums}
.slot .cell{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;border-inline-start:2px solid var(--line);padding:4px 12px;border-radius:8px;cursor:pointer}
.slot .cell:hover{background:var(--glass)}
.slot .cell:empty::after{content:'+ إضافة مهمة';color:var(--muted);font-size:.8rem;padding-top:7px;opacity:0;transition:opacity .15s}
.slot .cell:empty:hover::after{opacity:1}
.slot.now .cell{border-color:var(--cyan);background:rgba(93,225,255,.12)}
.slot.now .tm{color:var(--cyan);font-weight:600}
/* glass buttons */
@media (prefers-color-scheme:light){:root{--glass:rgba(255,255,255,.22);--glass2:rgba(255,255,255,.32)}.btn.ghost{background:rgba(255,255,255,.25)}}
.btn.ghost,.pill,.snd,.bgr{backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%)}
.btn.ghost{background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.btn.ghost:hover{background:rgba(255,255,255,.18)}
.btn.primary{background:linear-gradient(135deg,rgba(93,225,255,.3),rgba(155,140,255,.3));border:1px solid rgba(93,225,255,.55);color:var(--text);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);box-shadow:0 0 22px rgba(93,225,255,.28),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.primary:hover{background:linear-gradient(135deg,rgba(93,225,255,.42),rgba(155,140,255,.42));box-shadow:0 0 30px rgba(93,225,255,.5),inset 0 1px 0 rgba(255,255,255,.3)}
.pill.sel{background:linear-gradient(135deg,rgba(93,225,255,.38),rgba(155,140,255,.38));border-color:rgba(93,225,255,.6);color:var(--text)}
.gicon{width:1.25em;height:1.25em;stroke:none}
/* background */
:root{--dimc:5,10,25}
@media (prefers-color-scheme:light){:root{--dimc:255,255,255}}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:var(--bgd,none) center/cover no-repeat}
body::after{content:'';position:fixed;inset:0;z-index:-1;background:rgba(var(--dimc),var(--dim,0))}
@media (max-width:760px),(orientation:portrait){body::before{background-image:var(--bgp,none)}}
.bgr{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--glass);border:1px solid var(--line);margin-bottom:10px}
.bgr .th{width:54px;height:54px;border-radius:12px;background:var(--glass2) center/cover;flex:none}
.bgr .nm{flex:1}
.bgr input[type=file]{display:none}
#dim{width:100%;accent-color:var(--cyan)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(3,8,20,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ov.open{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;background:var(--bg2);background:color-mix(in srgb,var(--bg2) 82%,transparent)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mh h3{margin:0;font-size:1.2rem}
.prog{display:flex;gap:6px;margin-bottom:6px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--glass2);transition:background .3s,box-shadow .3s}
.prog i.on{background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 10px rgba(93,225,255,.5)}
.stepname{color:var(--muted);font-size:.85rem;margin-bottom:16px}
.pane{display:none;flex-direction:column;gap:14px}
.pane.show{display:flex}
.pane.fwd{animation:inL .3s ease}.pane.back{animation:inR .3s ease}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
label{font-size:.88rem;color:var(--muted);display:block;margin-bottom:6px}
.field{width:100%;padding:12px 14px;border-radius:14px;background:var(--glass);border:1px solid var(--line);outline:none}
.field:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(93,225,255,.2)}
select.field option{color:#14213a}
.time{display:flex;gap:10px;align-items:center;direction:ltr}
.time .field{text-align:center;font-size:1.6rem;font-weight:600;padding:10px}
.time span{font-size:1.6rem}
.sounds{display:flex;flex-direction:column;gap:8px}
.snd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--line);cursor:pointer;transition:.2s}
.snd.sel{border-color:var(--cyan);background:var(--glass2);box-shadow:0 0 16px rgba(93,225,255,.2)}
.snd .nm{flex:1}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:9px 15px;border-radius:13px;background:var(--glass);border:1px solid var(--line);transition:.2s}
.pill.sel{background:linear-gradient(135deg,var(--cyan),var(--violet));color:#06122a;border-color:transparent;font-weight:600}
.pill[disabled]{opacity:.55;pointer-events:none}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{min-width:2ch;text-align:center;font-size:1.4rem}
.sum{padding:14px;border-radius:16px;background:var(--glass);border:1px solid var(--line);display:grid;gap:8px;font-size:.95rem}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum span{color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.err{color:var(--danger);font-size:.85rem;min-height:1.1em}
.toast{position:fixed;inset-inline:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));margin:auto;max-width:420px;padding:14px 18px;display:none;align-items:center;gap:12px;z-index:60;border-color:var(--cyan)}
.toast.show{display:flex;animation:pop .3s}
.toast p{margin:0;flex:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>جدولي الأسبوعي</h1>
      <p class="sub" id="range"></p>
    </div>
    <div class="stats">
      <span class="chip">مهام اليوم<b id="sToday">0</b></span>
      <span class="chip">المكتملة<b id="sDone">0</b></span>
      <button class="btn ghost" id="bgBtn"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/></svg>الخلفية</button>
      <button class="btn ghost" id="gBtn" hidden><svg class="gicon" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.5l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7A14.5 14.5 0 019.5 24c0-1.6.3-3.2.8-4.7l-7.9-6.1A24 24 0 000 24c0 3.9.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.8 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg> ربط مع قوقل</button>
      <button class="btn primary" id="addBtn"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>إضافة مهمة</button>
    </div>
  </header>
  <nav class="views" id="views"><button class="pill sel" data-v="week">الأسبوع</button><button class="pill" data-v="day">جدول اليوم · كل 15 دقيقة</button></nav>
  <main class="week" id="week"></main>
  <section id="dayView" hidden></section>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="modal glass">
    <div class="mh"><h3 id="mt">مهمة جديدة</h3><button class="ib" id="close" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="prog" id="prog"><i></i><i></i><i></i><i></i></div>
    <div class="stepname" id="stepname"></div>

    <section class="pane" data-s="0">
      <div><label for="title">اسم المهمة</label><input class="field" id="title" maxlength="80" placeholder="مثال: مراجعة درس الشبكات" autocomplete="off"></div>
      <div><label>الوقت</label>
        <div class="time"><select class="field" id="hh" aria-label="الساعة"></select><span>:</span><select class="field" id="mm" aria-label="الدقيقة"></select></div>
      </div>
      <div class="err" id="err"></div>
    </section>

    <section class="pane" data-s="1">
      <label>نغمة المنبه</label>
      <div class="sounds" id="sounds"></div>
    </section>

    <section class="pane" data-s="2">
      <div><label>نمط التكرار</label>
        <div class="dots" id="rep">
          <button class="pill" data-v="once">مرة واحدة</button>
          <button class="pill" data-v="weekly">أسبوعي</button>
          <button class="pill" data-v="daily">يومي</button>
        </div></div>
      <div><label>أيام الأسبوع</label><div class="dots" id="days"></div></div>
    </section>

    <section class="pane" data-s="3">
      <div><label>عدد مرات التنبيه في اليوم</label>
        <div class="stepper"><button class="ib" id="tMinus" aria-label="أقل"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button><b id="tVal">1</b><button class="ib" id="tPlus" aria-label="أكثر"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div></div>
      <div id="ivBox"><label for="iv">الفاصل بين التنبيهات</label>
        <select class="field" id="iv"><option value="5">كل 5 دقائق</option><option value="10">كل 10 دقائق</option><option value="15">كل 15 دقيقة</option><option value="30">كل 30 دقيقة</option><option value="60">كل ساعة</option><option value="120">كل ساعتين</option></select></div>
      <div class="sum" id="sum"></div>
    </section>

    <div class="foot">
      <button class="btn ghost" id="prev">السابق</button>
      <button class="btn primary" id="next">التالي</button>
    </div>
  </div>
</div>

<div class="ov" id="bgOv" role="dialog" aria-modal="true" aria-label="خلفية التطبيق">
  <div class="modal glass">
    <div class="mh"><h3>خلفية التطبيق</h3><button class="ib" id="bgClose" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="bgRows"></div>
    <label for="dim">تعتيم الخلفية لوضوح النص</label>
    <input type="range" id="dim" min="0" max="80" value="35">
    <p class="stepname" style="margin:12px 0 0">تُحفظ الصورة على جهازك فقط. إذا اخترت صورة لأحد الحجمين فقط فستُستخدم للاثنين.</p>
  </div>
</div>

<div class="toast glass" id="toast" role="status"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 004 0"/></svg><p id="toastTxt"></p><button class="ib" id="toastX" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

<script>
const DAYS=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const REP={once:'مرة واحدة',weekly:'أسبوعي',daily:'يومي'};

  loop:'<svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 013-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 01-3 3H3"/></svg>'
};
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function weekStart(d=new Date()){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x}
function dateOf(i){const x=weekStart();x.setDate(x.getDate()+i);return x}

let tasks=[];
try{tasks=JSON.parse(localStorage.getItem('planner-tasks-v1')||'[]')}catch(e){tasks=[]}
function save(){try{localStorage.setItem('planner-tasks-v1',JSON.stringify(tasks));localStorage.setItem('planner-updated',Date.now())}catch(e){}cloudPush()}

function applies(t,i){
  if(t.repeat==='daily')return true;
  if(!t.days.includes(i))return false;
  return t.repeat==='weekly'||t.week===dk(weekStart());
}
function fmt(t){const [h,m]=t.time.split(':').map(Number);return (h%12||12)+':'+pad(m)+' '+(h<12?'ص':'م')}

/* ---------- render ---------- */
function render(){
  const wk=$('#week');wk.innerHTML='';
  const todayI=new Date().getDay();let tc=0,td=0;
  for(let i=0;i<7;i++){
    const d=dateOf(i),key=dk(d);
    const list=tasks.filter(t=>applies(t,i)).sort((a,b)=>a.time.localeCompare(b.time));
    const done=list.filter(t=>t.done&&t.done[key]).length;
    if(i===todayI){tc=list.length;td=done}
    const card=document.createElement('section');
    card.className='day glass'+(i===todayI?' today':'');
    card.innerHTML=`<h2><span>${DAYS[i]} ${i===todayI?'<span class="badge">اليوم</span>':''}</span><small>${d.getDate()}/${d.getMonth()+1}</small></h2>
      <div class="bar"><i style="width:${list.length?done/list.length*100:0}%"></i></div><div class="tasks"></div>
      <button class="btn ghost" data-add="${i}"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>مهمة جديدة</button>`;
    const box=card.querySelector('.tasks');
    if(!list.length)box.innerHTML='<div class="empty">لا توجد مهام في هذا اليوم</div>';
    list.forEach(t=>{
      const isDone=!!(t.done&&t.done[key]);
      const el=document.createElement('div');el.className='task'+(isDone?' done':'');
      el.innerHTML=`<button class="ck" data-tg="${t.id}|${key}" aria-label="تحديد كمكتملة">${I.chk}</button>
        <div class="info"><div class="t">${esc(t.title)}</div><div class="m"><span>${I.clock}${fmt(t)}</span><span>${I.bell}${SOUNDS[t.sound]?SOUNDS[t.sound].n:''}</span>${t.times>1?`<span>${I.loop}${t.times} مرات</span>`:''}</div></div>
        <div class="acts"><button class="ib" data-ed="${t.id}" aria-label="تعديل">${I.edit}</button><button class="ib del" data-dl="${t.id}" aria-label="حذف">${I.del}</button></div>`;
      box.appendChild(el);
    });
    wk.appendChild(card);
  }
  $('#sToday').textContent=tc;$('#sDone').textContent=td;
  const a=dateOf(0),b=dateOf(6);
  $('#range').textContent='أسبوع '+a.getDate()+'/'+(a.getMonth()+1)+' – '+b.getDate()+'/'+(b.getMonth()+1)+' · '+(tc?`لديك ${tc} مهام اليوم`:'يومك فارغ، أضف مهمة');
}
$('#week').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.add!==undefined)openWiz(null,+b.dataset.add);
  else if(b.dataset.tg){const [id,key]=b.dataset.tg.split('|');const t=tasks.find(x=>x.id===id);t.done=t.done||{};t.done[key]=!t.done[key];save();render()}
  else if(b.dataset.ed)openWiz(b.dataset.ed);
  else if(b.dataset.dl){tasks=tasks.filter(x=>x.id!==b.dataset.dl);save();render();toast('تم حذف المهمة')}
});

/* ---------- audio ---------- */
let ac,cur;
function play(name){
  const S=SOUNDS[name]||SOUNDS.bell;
  try{
    if(cur){cur.pause();cur=null}
    if(S.u){cur=new Audio(S.u);cur.play().catch(()=>{});return}
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
    let t=ac.currentTime+.02;
    (SOUNDS[name]||SOUNDS.bell).s.forEach(([f,d,type])=>{
      if(f){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
        g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);
        o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}
      t+=d;
    });
  }catch(e){}
}

/* ---------- wizard ---------- */
let step=0,draft={},editId=null;
const hh=$('#hh'),mm=$('#mm');
for(let i=0;i<24;i++)hh.add(new Option(pad(i),pad(i)));
for(let i=0;i<60;i++)mm.add(new Option(pad(i),pad(i)));
$('#sounds').innerHTML=Object.entries(SOUNDS).map(([k,v])=>`<div class="snd" data-k="${k}" tabindex="0" role="radio"><span class="nm">${v.n}</span><button class="ib" data-pv="${k}" aria-label="معاينة ${v.n}">${I.play}</button></div>`).join('');
$('#days').innerHTML=DAYS.map((d,i)=>`<button class="pill" data-d="${i}">${d}</button>`).join('');

function openWiz(id,dayI,at){
  editId=id;
  const t=id&&tasks.find(x=>x.id===id);
  const n=new Date();
  draft=t?{...t,days:[...t.days]}:{title:'',time:at!==undefined?pad(Math.floor(at/60))+':'+pad(at%60):pad(n.getHours())+':'+pad(Math.ceil(n.getMinutes()/5)*5%60),sound:'notif',repeat:'weekly',days:[dayI!==undefined?dayI:n.getDay()],times:1,interval:15};
  $('#title').value=draft.title;
  const [h,m]=draft.time.split(':');hh.value=h;mm.value=m;
  $('#iv').value=draft.interval;
  $('#mt').textContent=t?'تعديل المهمة':'مهمة جديدة';
  $('#next').textContent='التالي';
  step=0;show(0,'fwd');syncAll();
  $('#ov').classList.add('open');setTimeout(()=>$('#title').focus(),50);
}
function closeWiz(){$('#ov').classList.remove('open')}
function show(s,dir){
  document.querySelectorAll('.pane').forEach(p=>{p.classList.remove('show','fwd','back');if(+p.dataset.s===s)p.classList.add('show',dir)});
  document.querySelectorAll('#prog i').forEach((b,i)=>b.classList.toggle('on',i<=s));
  $('#stepname').textContent='الخطوة '+(s+1)+' من 4 · '+STEPS[s];
  $('#prev').style.visibility=s?'visible':'hidden';
  $('#next').innerHTML=s===3?I.chk+' '+(editId?'حفظ التعديلات':'حفظ وإضافة للجدول'):'التالي';
  if(s===3)summary();
}
function syncAll(){
  document.querySelectorAll('.snd').forEach(e=>e.classList.toggle('sel',e.dataset.k===draft.sound));
  document.querySelectorAll('#rep .pill').forEach(e=>e.classList.toggle('sel',e.dataset.v===draft.repeat));
  const all=draft.repeat==='daily';
  document.querySelectorAll('#days .pill').forEach(e=>{e.classList.toggle('sel',all||draft.days.includes(+e.dataset.d));e.disabled=all});
  $('#tVal').textContent=draft.times;$('#ivBox').style.display=draft.times>1?'block':'none';
}
function summary(){
  const days=draft.repeat==='daily'?'كل الأيام':draft.days.slice().sort().map(i=>DAYS[i]).join('، ');
  $('#sum').innerHTML=`<div><span>المهمة</span><b>${esc(draft.title)}</b></div><div><span>الوقت</span><b>${fmt(draft)}</b></div>
   <div><span>النغمة</span><b>${SOUNDS[draft.sound].n}</b></div><div><span>النمط</span><b>${REP[draft.repeat]}</b></div><div><span>الأيام</span><b>${days}</b></div>
   <div><span>التنبيه يومياً</span><b>${draft.times===1?'مرة واحدة':draft.times+' مرات، كل '+(draft.interval>=60?draft.interval/60+' ساعة':draft.interval+' دقيقة')}</b></div>`;
}
$('#sounds').addEventListener('click',e=>{
  const pv=e.target.closest('[data-pv]');
  if(pv){play(pv.dataset.pv);e.stopPropagation();return}
  const s=e.target.closest('.snd');if(s){draft.sound=s.dataset.k;syncAll();play(draft.sound)}
});
$('#rep').addEventListener('click',e=>{const b=e.target.closest('.pill');if(b){draft.repeat=b.dataset.v;syncAll()}});
$('#days').addEventListener('click',e=>{
  const b=e.target.closest('.pill');if(!b)return;const i=+b.dataset.d;
  draft.days=draft.days.includes(i)?draft.days.filter(x=>x!==i):[...draft.days,i];syncAll();
});
$('#tMinus').onclick=()=>{draft.times=Math.max(1,draft.times-1);syncAll()};
$('#tPlus').onclick=()=>{draft.times=Math.min(8,draft.times+1);syncAll()};
$('#next').onclick=()=>{
  if(step===0){
    const v=$('#title').value.trim();
    if(!v){$('#err').textContent='اكتب اسم المهمة للمتابعة';$('#title').focus();return}
    $('#err').textContent='';draft.title=v;draft.time=hh.value+':'+mm.value;
  }
  if(step===2&&draft.repeat!=='daily'&&!draft.days.length){toast('اختر يوماً واحداً على الأقل');return}
  if(step===3){draft.interval=+$('#iv').value;finish();return}
  step++;show(step,'fwd');
};
$('#prev').onclick=()=>{if(step){step--;show(step,'back')}};
$('#close').onclick=closeWiz;
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeWiz()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeWiz()});
$('#title').addEventListener('keydown',e=>{if(e.key==='Enter')$('#next').click()});
function finish(){
  if(draft.repeat==='daily')draft.days=[0,1,2,3,4,5,6];
  if(editId){const i=tasks.findIndex(x=>x.id===editId);tasks[i]={...tasks[i],...draft,week:tasks[i].week||dk(weekStart())}}
  else tasks.push({...draft,id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),week:dk(weekStart()),done:{}});
  save();closeWiz();render();toast(editId?'تم حفظ التعديلات':'تمت إضافة المهمة إلى الجدول');
}
$('#addBtn').onclick=()=>openWiz(null);

/* ---------- toast & alarms ---------- */
let tt;
function toast(msg){$('#toastTxt').textContent=msg;$('#toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('show'),4000)}
$('#toastX').onclick=()=>{if(cur)cur.pause();$('#toast').classList.remove('show');clearTimeout(tt)};
const fired=new Set();
setInterval(()=>{
  const n=new Date(),i=n.getDay(),key=dk(n),mins=n.getHours()*60+n.getMinutes();
  tasks.forEach(t=>{
    if(!applies(t,i)||(t.done&&t.done[key]))return;
    const [h,m]=t.time.split(':').map(Number);
    for(let k=0;k<t.times;k++){
      if(h*60+m+k*t.interval!==mins)continue;
      const f=key+t.id+k;if(fired.has(f))continue;fired.add(f);
      play(t.sound);if(!SOUNDS[t.sound].u||SOUNDS[t.sound].short)setTimeout(()=>play(t.sound),2600);
      toast('حان موعد: '+t.title);clearTimeout(tt);
    }
  });
},1000);
/* ---------- daily 15-minute timetable ---------- */
let view='week',selDay=new Date().getDay();
const _render=render;
render=function(){_render();if(view==='day')renderDay()};
function lbl(m){const h=Math.floor(m/60);return (h%12||12)+':'+pad(m%60)+' '+(h<12?'ص':'م')}
function renderDay(scroll){
  const box=$('#dayView'),key=dk(dateOf(selDay)),n=new Date();
  const slots=Array.from({length:96},()=>[]);
  tasks.filter(t=>applies(t,selDay)).forEach(t=>{
    const [h,m]=t.time.split(':').map(Number);
    for(let k=0;k<t.times;k++){const s=h*60+m+k*t.interval;if(s<1440)slots[Math.floor(s/15)].push({t,k,s})}
  });
  const now=selDay===n.getDay()?Math.floor((n.getHours()*60+n.getMinutes())/15):-1;
  let h='<div class="dtabs">'+DAYS.map((d,i)=>`<button class="pill${i===selDay?' sel':''}" data-dd="${i}">${d}</button>`).join('')+'</div><div class="tl glass">';
  slots.forEach((list,i)=>{
    if(i%4===0)h+=`<div class="hr">الساعة ${Math.floor(i/4)%12||12} ${i<48?'صباحاً':'مساءً'}</div>`;
    h+=`<div class="slot${i===now?' now':''}"><div class="tm">${lbl(i*15)}</div><div class="cell" data-sl="${i}">`+list.map(({t,k,s})=>{
      const d=t.done&&t.done[key];
      return `<div class="task${d?' done':''}"><button class="ck" data-tg="${t.id}|${key}" aria-label="تحديد كمكتملة">${I.chk}</button><div class="info"><div class="t">${esc(t.title)}</div><div class="m"><span>${I.clock}${lbl(s)}</span>${t.times>1?`<span>${I.loop}${k+1}/${t.times}</span>`:''}</div></div><div class="acts"><button class="ib" data-ed="${t.id}" aria-label="تعديل">${I.edit}</button><button class="ib del" data-dl="${t.id}" aria-label="حذف">${I.del}</button></div></div>`;
    }).join('')+'</div></div>';
  });
  box.innerHTML=h+'</div>';
  if(scroll){const el=box.querySelector('.now')||box.querySelector('.slot:nth-of-type(30)');if(el)el.scrollIntoView({block:'center'})}
}
function setView(v){
  view=v;
  document.querySelectorAll('#views .pill').forEach(x=>x.classList.toggle('sel',x.dataset.v===v));
  $('#week').hidden=v!=='week';$('#dayView').hidden=v!=='day';
  if(v==='day')renderDay(true);
}
$('#views').addEventListener('click',e=>{const b=e.target.closest('.pill');if(b)setView(b.dataset.v)});
$('#dayView').addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(b&&b.dataset.dd!==undefined){selDay=+b.dataset.dd;renderDay(true);return}
  if(b&&b.dataset.tg){const [id,key]=b.dataset.tg.split('|');const t=tasks.find(x=>x.id===id);t.done=t.done||{};t.done[key]=!t.done[key];save();render();return}
  if(b&&b.dataset.ed){openWiz(b.dataset.ed);return}
  if(b&&b.dataset.dl){tasks=tasks.filter(x=>x.id!==b.dataset.dl);save();render();toast('تم حذف المهمة');return}
  const c=e.target.closest('.cell');
  if(c&&!e.target.closest('.task'))openWiz(null,selDay,+c.dataset.sl*15);
});
setInterval(()=>{if(view==='day'&&!$('#ov').classList.contains('open'))renderDay()},60000);
/* ---------- custom background ---------- */
let BG={p:null,d:null,dim:35};
try{Object.assign(BG,JSON.parse(localStorage.getItem('planner-bg-v1')||'{}'))}catch(e){}
function bgSave(){try{localStorage.setItem('planner-bg-v1',JSON.stringify(BG));return true}catch(_){return false}}
function bgApply(){
  const r=document.documentElement.style,u=x=>x?`url("${x}")`:'none';
  r.setProperty('--bgd',u(BG.d||BG.p));r.setProperty('--bgp',u(BG.p||BG.d));
  r.setProperty('--dim',(BG.p||BG.d)?BG.dim/100:0);
  document.querySelectorAll('.bgr .th').forEach(t=>t.style.backgroundImage=BG[t.dataset.k]?u(BG[t.dataset.k]):'');
}
function shrink(file,max){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{
  const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
  c.getContext('2d').drawImage(im,0,0,c.width,c.height);let q=.82,d=c.toDataURL('image/jpeg',q);
  while(d.length>1.6e6&&q>.4){q-=.1;d=c.toDataURL('image/jpeg',q)}ok(d)};im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(file)})}
$('#bgRows').innerHTML=[['p','للهاتف · صورة طولية'],['d','للحاسبة · صورة عرضية']].map(([k,n])=>`<div class="bgr"><div class="th" data-k="${k}"></div><div class="nm">${n}</div><label class="btn ghost" style="margin:0;color:var(--text)">اختيار<input type="file" accept="image/*" data-k="${k}"></label><button class="ib del" data-rm="${k}" aria-label="إزالة الصورة">${I.del}</button></div>`).join('');
$('#bgRows').addEventListener('change',async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;const k=e.target.dataset.k;
  try{const d=await shrink(f,k==='p'?1280:1920),old=BG[k];BG[k]=d;if(!bgSave()){BG[k]=old;toast('الصورة كبيرة على مساحة التخزين، جرّب صورة أصغر')}}catch(_){toast('تعذر قراءة الصورة')}
  e.target.value='';bgApply();
});
$('#bgRows').addEventListener('click',e=>{const b=e.target.closest('[data-rm]');if(b){BG[b.dataset.rm]=null;bgSave();bgApply()}});
$('#dim').oninput=e=>{BG.dim=+e.target.value;bgSave();bgApply()};
$('#bgBtn').onclick=()=>$('#bgOv').classList.add('open');
$('#bgClose').onclick=()=>$('#bgOv').classList.remove('open');
$('#bgOv').addEventListener('click',e=>{if(e.target.id==='bgOv')e.currentTarget.classList.remove('open')});
$('#dim').value=BG.dim;bgApply();

function cloudInit(){
  if(!FIREBASE_CONFIG)return;
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const load=s=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=base+s;e.onload=ok;e.onerror=no;document.head.appendChild(e)});

async function cloudPull(){

    const s=await fdb.collection('users').doc(fuser.uid).get(),loc=+localStorage.getItem('planner-updated')||0;
    if(s.exists&&s.data().updated>loc){

      render();toast('تم تحميل جداولك من حسابك');
    }else cloudPush(true);
  }catch(e){toast('تعذر الاتصال بحسابك الآن')}
}
function cloudPush(now){

  pushT=setTimeout(()=>fdb.collection('users').doc(fuser.uid).set({tasks:JSON.stringify(tasks),updated:+localStorage.getItem('planner-updated')||Date.now()}).catch(()=>{}),now?0:800);
}

};
